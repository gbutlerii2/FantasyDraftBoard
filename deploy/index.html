document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201e1d;\n  --color-accent: #ec3013;\n  --color-accent-2: #e15b47;\n  --color-divider: color-mix(in srgb, #201e1d 40%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #fff2ef;\n  --color-accent-200: #ffe0d9;\n  --color-accent-300: #ffc4b8;\n  --color-accent-400: #ff9783;\n  --color-accent-500: #ff563c;\n  --color-accent-600: #dd2b0f;\n  --color-accent-700: #ae1800;\n  --color-accent-800: #7c1405;\n  --color-accent-900: #4d170e;\n\n  --color-accent-2-100: #fff2ef;\n  --color-accent-2-200: #ffe0da;\n  --color-accent-2-300: #ffc4b9;\n  --color-accent-2-400: #ff9784;\n  --color-accent-2-500: #ef6853;\n  --color-accent-2-600: #c94b39;\n  --color-accent-2-700: #9e3526;\n  --color-accent-2-800: #71261b;\n  --color-accent-2-900: #471d16;\n\n  --font-heading: \"Archivo\", system-ui, sans-serif;\n  --font-heading-weight: 800;\n  --font-body: \"Archivo\", system-ui, sans-serif;\n\n  --space-1: 4.0px;\n  --space-2: 8.0px;\n  --space-3: 12.0px;\n  --space-4: 16.0px;\n  --space-6: 24.0px;\n  --space-8: 32.0px;\n\n  --radius-sm: 0px;\n  --radius-md: 0px;\n  --radius-lg: 0px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<link rel=\"icon\" href=\"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' sc-camel-view-box='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23201e1d'/%3E%3Cellipse cx='32' cy='32' rx='21' ry='12.5' transform='rotate(-40 32 32)' fill='%23ec3013'/%3E%3Cg stroke='%23fff' stroke-width='2.6' stroke-linecap='round'%3E%3Cline x1='23' y1='41' x2='41' y2='23'/%3E%3Cline x1='26.5' y1='31' x2='32.5' y2='37'/%3E%3Cline x1='31.5' y1='26.5' x2='37.5' y2='32.5'/%3E%3C/g%3E%3C/svg%3E\">\n<script src=\"f9ee5e32-d43e-4330-a030-8156f596d43a\"><\u002Fscript>\n<style>\nhtml,body{margin:0;height:100%;background:#0d0d0d;font-family:\"Archivo\",system-ui,sans-serif;-webkit-font-smoothing:antialiased}\na{color:#ec3013}a:hover{color:#ae1800}\n*{box-sizing:border-box}\n.scrl::-webkit-scrollbar{height:7px;width:7px}\n.scrl::-webkit-scrollbar-thumb{background:#444141}\n.scrl::-webkit-scrollbar-track{background:#161616}\ninput,select,button{font-family:\"Archivo\",system-ui,sans-serif}\ninput:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid #ec3013;outline-offset:2px}\n.hit:hover{filter:brightness(1.18)}\n.hit:active{filter:brightness(.9)}\n@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}\n@keyframes tick{from{transform:translateX(0)}to{transform:translateX(calc(-100% - var(--tickW, 100vw)))}}\n@keyframes slowflash{0%,100%{opacity:1}50%{opacity:.42}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"{{ appSt }}\">\n\n  <div style=\"flex:none;height:52px;background:#000;border-bottom:2px solid #ec3013;display:flex;align-items:center;padding:0 12px;gap:12px\">\n    <div style=\"width:4px;height:26px;background:#ec3013;flex:none\"><\u002Fdiv>\n    <div style=\"min-width:0\">\n      <div style=\"font:800 15px 'Archivo';color:#fff;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ leagueName }}<\u002Fdiv>\n      <div style=\"font:600 9px 'Archivo';color:#7d7979;letter-spacing:.12em;white-space:nowrap\">{{ leagueMeta }}<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-left:auto;display:flex;align-items:center;gap:8px;flex:none\">\n      <div style=\"display:flex;align-items:center;gap:5px;padding-right:4px\">\n        <div style=\"width:7px;height:7px;background:#1a7f3c;animation:pulse 2s infinite\"><\u002Fdiv>\n        <span style=\"font:700 9px 'Archivo';color:{{ syncCol }};letter-spacing:.1em;display:{{ syncTextDisplay }}\">{{ syncLabel }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:8px;border:1px solid #444141;padding:6px 9px\">\n        <span style=\"width:8px;height:8px;background:{{ meDot }};flex:none\"><\u002Fspan>\n        <span style=\"font:800 9px 'Archivo';color:#fff;letter-spacing:.08em;white-space:nowrap\">{{ meLabel }}<\u002Fspan>\n        <span class=\"hit\" sc-camel-on-click=\"{{ logout }}\" style=\"font:800 9px 'Archivo';color:#ec3013;letter-spacing:.08em;cursor:pointer\">SIGN OUT<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ actionBarOn }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"flex:none;background:#201e1d;border-bottom:2px solid #444141;display:flex;align-items:center;gap:12px;padding:9px 12px;flex-wrap:wrap\">\n      <span class=\"hit\" sc-camel-on-click=\"{{ kickerClick }}\" style=\"font:800 10px 'Archivo';color:#ec3013;letter-spacing:.16em;cursor:{{ kickerCursor }}\">{{ actionKicker }}<\u002Fspan>\n      <span style=\"font:600 10px 'Archivo';color:#9b9797;letter-spacing:.04em;flex:1;min-width:140px\">{{ actionHint }}<\u002Fspan>\n      <div class=\"hit\" sc-camel-on-click=\"{{ exportXls }}\" style=\"border:1px solid #444141;color:#fff;font:800 10px 'Archivo';letter-spacing:.08em;padding:9px 13px;cursor:pointer;flex:none\">EXPORT .XLS<\u002Fdiv>\n      <div class=\"hit\" sc-camel-on-click=\"{{ exportImage }}\" style=\"display:{{ shotDisplay }};border:1px solid #444141;color:#fff;font:800 10px 'Archivo';letter-spacing:.08em;padding:9px 13px;cursor:pointer;flex:none\">SAVE BOARD IMAGE<\u002Fdiv>\n      <div class=\"hit\" sc-camel-on-click=\"{{ openStart }}\" style=\"display:{{ startDisplay }};background:#ec3013;color:#fff;font:800 10px 'Archivo';letter-spacing:.08em;padding:9px 13px;cursor:pointer;flex:none\">START DRAFT<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div class=\"hit\" sc-camel-on-click=\"{{ focusCur }}\" style=\"flex:none;background:{{ clockBg }};display:flex;align-items:center;gap:12px;padding:10px 12px;cursor:pointer\">\n    <div style=\"position:relative;width:46px;height:46px;flex:none;background:{{ clockLogo.bg }};background-image:{{ clockLogo.bi }};overflow:hidden\">\n      <div style=\"position:absolute;background:{{ clockLogo.c }};top:{{ clockLogo.t }};left:{{ clockLogo.l }};right:{{ clockLogo.r }};bottom:{{ clockLogo.b }};width:{{ clockLogo.w }};height:{{ clockLogo.h }};transform:{{ clockLogo.tr }};clip-path:{{ clockLogo.cp }}\"><\u002Fdiv>\n      <div style=\"position:absolute;left:5px;bottom:3px;font:800 15px 'Archivo';color:{{ clockLogo.fg }};letter-spacing:-.03em\">{{ clockLogo.mono }}<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"min-width:0;flex:1\">\n      <div style=\"font:700 9px 'Archivo';color:rgba(255,255,255,.78);letter-spacing:.16em\">{{ clockKicker }}<\u002Fdiv>\n      <div style=\"font:800 26px/1 'Archivo';color:#fff;letter-spacing:-.02em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:{{ onClockAnim }}\">{{ onClockName }}<\u002Fdiv>\n      <div style=\"font:600 11.9px 'Archivo';color:rgba(255,255,255,.82);letter-spacing:.07em t\" sc-camel-on-click=\"{{ toggleTeam }}\" data-i=\"{{ t.idx }}\" style=\"display:flex;align-items:center;gap:10px;padding:10px 12px;background:#161616;cursor:pointer\">\n              <div style=\"position:relative;width:26px;height:26px;flex:none;background:{{ t.lg.bg }};background-image:{{ t.lg.bi }};overflow:hidden\">\n                <div style=\"position:absolute;background:{{ t.lg.c }};top:{{ t.lg.t }};left:{{ t.lg.l }};right:{{ t.lg.r }};bottom:{{ t.lg.b }};width:{{ t.lg.sw }};height:{{ t.lg.sh }};transform:{{ t.lg.tr }};clip-path:{{ t.lg.cp }}\"><\u002Fdiv>\n                <div style=\"position:absolute;left:3px;bottom:1px;font:800 9px 'Archivo';color:{{ t.lg.fg }}\">{{ t.lg.mono }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:1;min-width:0\">\n                <div style=\"display:flex;align-items:baseline;gap:7px;min-width:0\">\n                  <span style=\"font:800 18px 'Archivo';color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ t.name }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font:700 13px 'Archivo';color:#7d7979;letter-spacing:.03em;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ t.summary }}<\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"font:800 16px 'Archivo';color:#ec3013;flex:none\">{{ t.caret }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"border-top:1px solid #201e1d;background:#111;padding:11px 12px 13px 20px\">\n              <div style=\"font:800 9px 'Archivo';color:#ec3013;letter-spacing:.16em;margin-bottom:9px\">POSITION RANKS<\u002Fdiv>\n              <div style=\"display:grid;max-width:50%;min-width:260px;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(5,auto);grid-auto-flow:column;column-gap:22px;row-gap:7px\">\n                <sc-for list=\"{{ t.ranks }}\" as=\"b\" hint-placeholder-count=\"9\">\n                  <div style=\"display:flex;align-items:center;gap: :#7d7979;letter-spacing:.06em;flex:none\">{{ p.meta }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div class=\"scrl\" style=\"display:{{ adminDisplay }};flex:1;min-height:0;overflow:auto;flex-direction:column\">\n        <div style=\"padding:14px 12px;border-bottom:2px solid #2d2b2b\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:11px\">\n            <div style=\"font:800 9px 'Archivo';color:#ec3013;letter-spacing:.18em\">DRAFT BOARDS<\u002Fdiv>\n            <div style=\"font:700 8.5px 'Archivo';color:#7d7979;letter-spacing:.1em\">{{ boardsNote }}<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-for list=\"{{ boardRows }}\" as=\"b\" hint-placeholder-count=\"2\">\n            <div style=\"border:1px solid #444141;background:{{ b.bg }};padding:9px 10px;display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap\">\n              <div style=\"flex:1;min-width:150px\">\n                <div style=\"font:800 12.5px 'Archivo';color:#fff\">{{ b.title }}<\u002Fdiv>\n                <div style=\"font:600 9px 'Archivo';color:#9b9797;letter-spacing:.06em;margin-top:2px\">{{ b.meta }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div class=\"hit\" sc-camel-on-click=\"{{ goBoard }}\" data-b=\"{{ b.id }}\" style=\"border:1px solid #444141;color:{{ b.openCol }};font:800 9px 'Archivo';letter-spacing:.08em;padding:6px 9px;cursor:pointer\">{{ b.openLabel }}<\u002Fdiv>\n              <div class=\"hit\" sc-camel-on-click=\"{{ editBoard }}\" data-b=\"{{ b.id }}\" style=\"border:1px solid #444141;color:#fff;font:800 9px 'Archivo';letter-spacing:.08em;padding:6px 9px;cursor:pointer\">EDIT<\u002Fdiv>\n              <div class=\"hit\" sc-camel-on-click=\"{{ dupBoard }}\" data-b=\"{{ b.id }}\" style=\"border:1px solid #444141;color:#fff;font:800 9px 'Archivo';letter-spacing:.08em;padding:6px 9px;cursor:pointer\">DUPLICATE<\u002Fdiv>\n              <div class=\"hit\" sc-camel-on-click=\"{{ delBoard }}\" data-b=\"{{ b.id }}\" style=\"border:1px solid #444141;color:#ec3013;font:800 9px 'Archivo';letter-spacing:.08em;padding:6px 9px;cursor:pointer\">DELETE<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"border:1px solid #444141;padding:11px 10px;margin-top:9px\">\n            <div style=\"font:700 8.5px 'Archivo';color:#ec3013;letter-spacing:.12em;margin-bottom:9px\">{{ bfHeading }}<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px\">\n              <div>\n                <div style=\"font:700 8.5px 'Archivo';color:#7d7979;letter-spacing:.12em;margin-bottom:5px\">BOARD TITLE<\u002Fdiv>\n                <input value=\"{{ bfTitle }}\" sc-camel-on-change=\"{{ setBfTitle }}\" placeholder=\"EFL DRAFT 2026\" style=\"width:100%;background:#161616;border:1px solid #444141;color:#fff;font:700 13px 'Archivo';padding:9px 10px\">\n              <\u002Fdiv>\n              <div>\n                <div style=\"font:700 8.5px 'Archivo';color:#7d7979;letter-spacing:.12em;margin-bottom:5px\">SYNC ROOM (UNIQUE)<\u002Fdiv>\n                <input value=\"{{ bfRoom }}\" sc-camel-on-change=\"{{ setBfRoom }}\" placeholder=\"efl2026\" style=\"width:100%;background:#161616;border:1px solid #444141;color:#fff;font:700 13px 'Archivo';padding:9px 10px\">\n              <\u002Fdiv>\n              <div>\n                <div style=\"font:700 8.5px 'Archivo';color:#7d7979;letter-spacing:.12em;margin-bottom:5px\">DRAFT START<\u002Fdiv>\n                <input type=\"datetime-local\" value=\"{{ bfStart }}\" sc-camel-on-change=\"{{ setBfStart }}\" style=\"width:100%;background:#161616;border:1px solid #444141;color:#fff;font:700 13px 'Archivo';padding:9px 10px\">\n              <\u002Fdiv>\n              <div>\n                <div style=\"font:700 8.5px 'Archivo';color:#7d7979;letter-spacing:.12em;margin-bottom:5px\">PICK TIMER (SECONDS)<\u002Fdiv>\n                <input type=\"number\" value=\"{{ bfTimer }}\" sc-camel-on-change=\"{{ setBfTimer }}\" style=\"width:100%;background:#161616;border:1px solid #444141;color:#fff;font:700 13px 'Archivo';padding:9px 10px\">\n              <\u002Fdiv>\n              <div>\n                <div style=\"font:700 8.5px 'Archivo';color:#7d7979;letter-spacing:.12em;margin-bottom:5px\">NUMBER OF TEAMS (2–14)<\u002Fdiv>\n                <input type=\"number\" min=\"2\" max=\"14\" value=\"{{ bfCount }}\" sc-camel-on-change=\"{{ setBfCount }}\" style=\"width:100%;background:#161616;border:1px solid #444141;color:#fff;font:700 13px 'Archivo';padding:9px 10px\">\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font:700 8.5px 'Archivo';color:#7d7979;letter-spacing:.12em;margin:10px 0 5px\">TEAM NAMES — ONE PER LINE, DRAFT ORDER<\u002Fdiv>\n            <textarea value=\"{{ bfTeams }}\" sc-camel-on-change=\"{{ setBfTeams }}\" rows=\"10\" style=\"width:100%;background:#161616;border:1px solid #444141;color:#fff;font:700 12px/1.5 'Archivo';padding:9px 10px;resize:vertical\"><\u002Ftextarea>\n            <div style=\"display:flex;gap:6px;margin-top:9px;flex-wrap:wrap\">\n              <div class=\"hit\" sc-camel-on-click=\"{{ saveBoard }}\" style=\"background:#ec3013;color:#fff;font:800 10px 'Archivo';letter-spacing:.08em;padding:10px 13px;cursor:pointer\">{{ bfSaveLabel }}<\u002Fdiv>\n              <div class=\"hit\" sc-camel-on-click=\"{{ resetBoardForm }}\" style=\"border:1px solid #444141;color:#fff;font:800 10px 'Archivo';letter-spacing:.08em;padding:10px 13px;cursor:pointer\">CLEAR FORM<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font:600 9.5px/1.5 'Archivo';color:#7d7979;letter-spacing:.04em;margin-top:8px\">Each board keeps its own players CSV, keepers, picks and clock in its own sync room. Open a board, then load its players and pre-draft picks from this tab.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:14px 12px;border-bottom:2px solid #2d2b2b\">\n          <div style=\"font:800 9px 'Archivo';color:#ec3013;letter-spacing:.18em;margin-bottom:11px\">LEAGUE SETTINGS<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:11px\">\n            <div>\n              <div style=\"font:700 8.5px 'Archivo';color:#7d7979;letter-spacing:.12em;margin-bottom:5px\">LEAGUE NAME<\u002Fdiv>\n              <input value=\"{{ leagueName }}\" sc-camel-on-change=\"{{ setLeagueName }}\" style=\"width:100%;background:#161616;border:1px solid #444141;color:#fff;font:700 13px 'Archivo';padding:9px 10px\">\n            <\u002Fdiv>\n            <div>\n              <div style=\"font:700 8.5px 'Archivo';color:#7d7979;letter-spacing:.12em;margin-bottom:5px\">DRAFT START (DATE &amp; TIME)<\u002Fdiv>\n              <input type=\"datetime-local\" value=\"{{ startAt }}\" sc-camel-on-change=\"{{ setStartAt }}\" style=\"width:100%;background:#161616;border:1px solid #444141;color:#fff;font:700 13px 'Archivo';padding:9px 10px\">\n            <\u002Fdiv>\n            <div>\n              <div style=\"font:700 8.5px 'Archivo';color:#7d7979;letter-spacing:.12em;margin-bottom:5px\">PICK TIMER (SECONDS)<\u002Fdiv>\n              <input type=\"number\" value=\"{{ timerLen }}\" sc-camel-on-change=\"{{ setTimerLen }}\" style=\"width:100%;background:#161616;border:1px solid #444141;color:#fff;font:700 13px 'Archivo';padding:9px 10px\">\n            <\u002Fdiv>\n            <div>\n              <div style=\"font:700 8.5px 'Archivo';color:#7d7979;letter-spacing:.12em;margin-bottom:5px\">NUMBER OF TEAMS (2–14)<\u002Fdiv>\n              <input type=\"number\" min=\"2\" max=\"14\" value=\"{{ teamCount }}\" sc-camel-on-change=\"{{ setTeamCount }}\" style=\"width:100%;background:#161616;border:1px solid #444141;c 0 10px 'Archivo';letter-spacing:.08em;padding:11px 14px;cursor:pointer\">CLEAR SELECTION<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font:600 9.5px/1.5 'Archivo';color:#7d7979;letter-spacing:.05em;margin-top:9px\">{{ tradeNote }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"padding:14px 12px;border-bottom:2px solid #2d2b2b\">\n          <div style=\"display:flex;align-items:baseline;gap:10px;margin-bottom:11px\">\n            <span style=\"font:800 9px 'Archivo';color:#ec3013;letter-spacing:.18em\">LIVE SYNC · FIREBASE<\u002Fspan>\n            <span style=\"font:700 9px 'Archivo';color:#9b9797;letter-spacing:.1em\">{{ fbStatus }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end\">\n            <div style=\"flex:2;min-width:220px\">\n              <div style=\"font:700 8.5px 'Archivo';color:#7d7979;letter-spacing:.12em;margin-bottom:5px\">DATABASE URL · BUILT IN<\u002Fdiv>\n              <div style=\"width:100%;background:#161616;border:1px solid #333030;color:#9b9797;font:700 12px 'Archivo';padding:9px 10px;word-break:break-all\">{{ fbUrl }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex:1;min-width:120px\">\n              <div style=\"font:700 8.5px 'Archivo';color:#7d7979;letter-spacing:.12em;margin-bottom:5px\">ROOM · FROM BOARD<\u002Fdiv>\n              <div style=\"width:100%;background:#161616;border:1px solid #333030;color:#9b9797;font:700 12px 'Archivo';padding:9px 10px\">{{ fbRoom }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"hit\" sc-camel-on-click=\"{{ toggleFb }}\" style=\"background:#ec3013;color:#fff;font:800 10px 'Archivo';letter-spacing:.08em;padding:11px 14px;cursor:pointer;flex:none\">{{ fbBtn }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font:600 9.5px 'Archivo';color:#7d7979;letter-spacing:.05em;margin-top:9px;word-break:break-all\">{{ fbNote }}<\u002Fdiv>\n          <div style=\"border:1px solid #44414 n              <input type=\"password\" value=\"{{ fpKey }}\" sc-camel-on-change=\"{{ setFpKey }}\" placeholder=\"Paste your key for this refresh\" style=\"width:100%;background:#161616;border:1px solid #444141;color:#fff;font:700 13px 'Archivo';padding:9px 10px\">\n            <\u002Fdiv>\n            <div style=\"flex:1;min-width:160px\">\n              <div style=\"font:700 8.5px 'Archivo';color:#7d7979;letter-spacing:.12em;margin-bottom:5px\">PROXY ENDPOINT<\u002Fdiv>\n              <input value=\"{{ fpBase }}\" sc-camel-on-change=\"{{ setFpBase }}\" style=\"width:100%;background:#161616;border:1px solid #444141;color:#fff;font:700 12px 'Archivo';padding:9px 10px\">\n            <\u002Fdiv>\n            <div style=\"flex:none;width:84px\">\n              <div style=\"font:700 8.5px 'Archivo';color:#7d7979;letter-spacing:.12em;margin-bottom:5px\">SEASON<\u002Fdiv>\n              <input value=\"{{ fpSeason }}\" sc-camel-on-change=\"{{ setFpSeason }}\" style=\"width:100%;background:#161616;border:1px solid #444141;color:#fff;font:700 12px 'Archivo';padding:9px 10px\">\n            <\u002Fdiv>\n            <div class=\"hit\" sc-camel-on-click=\"{{ fpRefresh }}\" style=\"background:{{ fpBtnBg }};color:#fff;font:800 10px 'Archivo';letter-spacing:.08em;padding:11px 14px;cursor:pointer;flex:none\">{{ fpBtnLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font:600 9.5px/1.5 'Archivo';color:#9b9797;letter-spacing:.05em;margin-top:9px\">{{ fpStatus }}<\u002Fdiv>\n          <div style=\"font:700 9px 'Archivo';color:#7d7979;letter-spacing:.08em;margin-top:5px\">{{ fpLoadLine }}<\u002Fdiv>\n          <div style=\"display:{{ fpLogDisplay }};flex-direction:column;border:1px solid #2d2b2b;margin-top:9px\">\n            <div style=\"background:#161616;padding:8px 10px;font:700 8.5px 'Archivo';color:#ec3013;letter-spacing:.12em\">REFRESH DIAGNOSTICS<\u002Fdiv>\n            <sc-for list=\"{{ fpLog }}\" as=\"d\" hint-placeholder-count=\"0\">\n              <div styl "font:800 15px 'Archivo';color:rgba(255,255,255,.7)\">›››<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"hit\" sc-camel-on-click=\"{{ enterView }}\" style=\"margin-top:8px;border:2px solid #201e1d;padding:13px 15px;display:flex;align-items:center;justify-content:space-between;cursor:pointer\">\n            <span style=\"font:800 12px 'Archivo';color:#201e1d;letter-spacing:.06em\">ENTER VIEW ONLY<\u002Fspan>\n            <span style=\"font:700 9px 'Archivo';color:#7d7979;letter-spacing:.1em\">NO SIGN-IN NEEDED<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ cellOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ closeModal }}\" style=\"position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60\">\n      <div sc-camel-on-click=\"{{ stopProp }}\" ref=\"{{ cellBoxRef }}\" style=\"{{ cellBoxSt }}\">\n        <div style=\"padding:14px 16px 12px;border-bottom:1px solid #2d2b2b\">\n          <div style=\"font:700 9px 'Archivo';color:#7d7979;letter-spacing:.14em\">{{ cellMeta }}<\u002Fdiv>\n          <div style=\"font:800 21px 'Archivo';color:#fff;margin-top:3px\">{{ cellName }}<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ cellNoteShow }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:12px 16px;border-bottom:1px solid #2d2b2b;background:#1c1a1a\">\n            <div style=\"font:800 8.5px 'Archivo';color:#ec3013;letter-spacing:.16em;margin-bottom:5px\">TRADE NOTE<\u002Fdiv>\n            <div style=\"font:600 12.5px/1.5 'Archivo';color:#e6e4e4;white-space:pre-wrap\">{{ cellNoteText }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ cellNoteEdit }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:12px 16px;border-bottom:1px solid #2d2b2b;background:#1c1a1a\">\n            <div style=\"font:800 8.5px 'Archivo';color:#ec3013;letter-spacing:.16em;margin-bottom:6px\">TRADE NOTE<\u002Fdiv>\n            <textarea value=\"{{ noteDraftVal }}\" sc-camel-on-change=\"{{ setNoteDraft }}\" placeholder=\"What this pick was traded for\" style=\"width:100%;box-sizing:border-box;min-height:76px;resize:vertical;background:#111;border:1px solid #444141;color:#fff;font:600 12.5px/1.5 'Archivo';padding:8px 9px;outline:none\"><\u002Ftextarea>\n            <div style=\"display:flex;gap:8px;margin-top:9px\">\n              <div class=\"hit\" sc-camel-on-click=\"{{ saveNote }}\" style=\"background:#ec3013;color:#fff;font:800 10px 'Archivo';letter-spacing:.08em;padding:10px 13px;cursor:pointer\">SAVE NOTE<\u002Fdiv>\n              <div class=\"hit\" sc-camel-on-click=\"{{ cancelNote }}\" style=\"border:1px solid #444141;color:#fff;font:800 10px 'Archivo';letter-spacing:.08em;padding:10px 13px;cursor:pointer\">CANCEL<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font:600 9px/1.4 'Archivo';color:#7d7979;letter-spacing:.05em;margin-top:8px\">Saving an empty note removes it.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ cellNoteBtn }}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"hit\" sc-camel-on-click=\"{{ openNote }}\" style=\"height:50px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid #2d2b2b;font:800 13px 'Archivo';color:#fff;letter-spacing:.02em;cursor:pointer\">{{ cellNoteBtnLabel }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-for list=\"{{ cellActions }}\" as=\"a\" hint-placeholder-count=\"4\">\n          <div class=\"hit\" sc-camel-on-click=\"{{ cellAction }}\" data-a=\"{{ a.id }}\" style=\"height:50px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid #2d2b2b;font:800 13px 'Archivo';color:{{ a.col }};letter-spacing:.02em;cursor:pointer\">{{ a.label }}<\u002Fdiv>\n        <\u002Fsc-for>\n        <div class=\"hit\" sc-camel-on-click=\"{{ closeModal }}\" style=\"height:54px;display:flex;align-items:center;padding:0 16px;font: { flash: 'Write test failed: ' + (e && e.message ? e.message : 'network/CORS blocked') }));\n      },\n      setFbRoom: e => this.setState({ fbRoom: e.target.value }),\n      toggleFb: () => {\n        if (this.state.fbOn) { this.fbClose(); this.setState({ fbOn: false, fbStatus: 'OFF' }); }\n        else this.fbConnect();\n\n      },\n      poolNote: s.flash || (POOL.length + ' players loaded \\u00b7 CSV columns: player, pos, team, adp, posrank, bye \\u00b7 up to 600 rows'),\n      picksNote: 'CSV columns: round, team, player, pos, nfl, keeper \\u00b7 team may be a name or a slot number 1\\u201310 \\u00b7 round may be 1\\u2013' + ROUNDS + ' or FA1\\u2013FA' + FA_ROUNDS + ' \\u00b7 repeat a round+team row to stack a second player in that slot',\n      importPicks: e => this.readCsv(e, t => this.applyPicksCsv(t)),\n      importPlayers: e => this.readCsv(e, t => this.applyPlayersCsv(t)),\n      setLeagueName: e => this.stageLs('leagueName', e.target.value),\n      setTimerLen: e => this.stageLs('timerLen', Math.max(10, +e.target.value || 90)),\n      setStartAt: e => this.stageLs('startAt', e.target.value),\n      setSnakeStart: e => this.stageLs('snakeStart', Math.max(2, Math.min(20, +e.target.value || 7))),\n      setMaxKeepers: e => this.stageLs('maxKeepers', Math.max(0, Math.min(ROUNDS, +e.target.value || 0))),\n      setScoring: e => this.stageLs('scoring', e.target.value),\n      revertLeague: () => this.setState({ lsDraft: null, flash: '' }),\n      saveLeague: () => {\n        const d = this.state.lsDraft;\n        if (!d) { this.setState({ flash: 'No changes to save.' }); return; }\n        this.userTouched = true;\n        const next = { lsDraft: null };\n        ['leagueName', 'startAt', 'snakeStart', 'scoring', 'maxKeepers', 'names'].forEach(k => { if (d[k] !== undefined) next[k] = d[k]; });\n        if (d.timerLen !== undefined) {\n          next.timerLen = d.timerLen;\n          next.remain = d.timerLen;\n          if (this.state.phase !== 'predraft') next.deadline = Date.now() + d.timerLen * 1000;\n        }\n        this.setState(next, () => {\n          if (d.startAt !== undefined) this.stampBoardStart(d.startAt);\n          if (d.names !== undefined) this.stampBoardTeams(d.names);\n          this.publishNow();\n          this.setState({ flash: 'League settings saved.' });\n        });\n      },\n      setTeamCount: e => {\n        const base = (this.state.lsDraft && this.state.lsDraft.names) || this.state.names;\n        this.stageLs('names', fitTeams(base, clampN(e.target.value)));\n      },\n      setBfCount: e => {\n        const lines = String(this.state.bfTeams || '').split('\\n').map(x => x.trim()).filter(Boolean);\n        this.setState({ bfTeams: fitTeams(lines, clampN(e.target.value)).join('\\n') });\n      },\n      setTeamName: e => {\n        const i = +e.currentTarget.getAttribute('data-i'), v = e.target.value;\n        const base = (this.state.lsDraft && this.state.lsDraft.names) || this.state.names;\n        const names = base.slice(); names[i] = v;\n        this.stageLs('names', names);\n      },\n      setTpRound: e => this.setState({ tpRound: e.target.value }),\n      setTpSlot: e => this.setState({ tpSlot: e.target.value }),\n      setTpOwner: e => this.setState({ tpOwner: e.target.value }),\n      doTradePick: () => this.setState(x => {\n        const owners = Object.assign({}, x.owners);\n        const key = x.tpRound + '-' + x.tpSlot;\n        owners[key] = +x.tpOwner;\n        const picks = Object.assign({}, x.picks);\n        this.park(picks, key, +x.tpOwner);\n        return { owners, picks, flash: 'Round ' + x.tpRound + ' slot ' + (+x.tpSlot + 1) + ' now belongs to ' + (x.names[+x.tpOwner]) + '.' };\n      }, () => this.publishNow()),\n      setTaTeam: e => this.setState({ taTeam: e.target.value, taSel: [] }),\n      setTbTeam: e => this.setState({ tbTeam: e.target.value, tbSel: [] }),\n      toggleTa: e => { const k = e.currentTarget.getAttribute('data-k'); this.setState(x => ({ taSel: x.taSel.indexOf(k) >= 0 ? x.taSel.filter(v => v !== k) : x.taSel.concat([k]) })); },\n      toggleTb: e => { const k = e.currentTarget.getAttribute('data-k'); this.setState(x => ({ tbSel: x.tbSel.indexOf(k) >= 0 ? x.tbSel.filter(v => v !== k) : x.tbSel.concat([k]) })); },\n      clearTrade: () => this.setState({ taSel: [], tbSel: [], flash: '' }),\n      doTrade: () => this.setState(x => {\n        const a = +x.taTeam, b = +x.tbTeam;\n        if (a === b) return { flash: 'Pick two different teams.' };\n        if (!x.taSel.length && !x.tbSel.length) return { flash: 'Select at least one asset to move.' };\n        const owners = Object.assign({}, x.owners);\n        const picks = Object.assign({}, x.picks);\n        const errs = [];\n        // stacked-player refs run deepest index first so earlier removals don't shift later ones\n        const run = (list, dest) => {\n          list.slice().sort((p, q) => {\n            const [ka, ia] = [p.split(':')[0], +p.split(':')[1] || 0];\n            const [kb, ib] = [q.split(':')[0], +q.split(':')[1] || 0];\n            return ka === kb ? ib - ia : (ka < kb ? -1 : 1);\n          }).forEach(ref => {\n            if (ref.indexOf(':') < 0) { owners[ref] = dest; this.park(picks, ref, dest); return; }\n            const e = this.movePlayer(picks, owners, ref, dest);\n            if (e) errs.push(e);\n          });\n        };\n        run(x.taSel, b);\n        run(x.tbSel, a);\n        return { owners, picks, taSel: [], tbSel: [],\n          flash: errs.length ? 'Trade applied with issues: ' + errs.join('; ')\n            : x.names[a] + ' sends ' + x.taSel.length + ' asset(s), ' + x.names[b] + ' sends ' + x.tbSel.length + '. Trade applied.' };\n      }, () => this.publishNow()),\n      setTrA: e => this.setState({ trA: e.target.value }),\n      setTrB: e => this.setState({ trB: e.target.value }),\n      doTradePlayer: () => this.setState(x => {\n        const a = x.trA, b = x.trB;\n        if (!a || !b || a === b || !x.picks[a] || !x.picks[b]) return { flash: 'Pick two different rostered players to swap.' };\n        const picks = Object.assign({}, x.picks);\n        const pa = picks[a], pb = picks[b];\n        // swap the seated player only — stacked players stay with their slot\n        const strip = p => { const o = Object.assign({}, p); delete o.extra; return o; };\n        const keep = (dest, src) => { const o = strip(src); if (dest.extra && dest.extra.length) o.extra = dest.extra; return o; };\n        picks[a] = keep(pa, pb); picks[b] = keep(pb, pa);\n        return { picks, flash: pa.name + ' and ' + pb.name + ' have swapped rosters.' };\n      }, () => this.publishNow())\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
